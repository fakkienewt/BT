<div class="container">
    <div class="section-bar">НОВИНКИ</div>

    <div class="wrapper">
        <div class="carousel-arrow left-arrow" (click)="prevSlide()">
            <div class="arrow">‹</div>
        </div>

        <div class="card">
            <div class="section-grid" *ngIf="loading">
                <div *ngFor="let i of [1,2,3,4,5,6]" class="product-skeleton">
                    <div class="skeleton-poster">
                        <div class="skeleton-shimmer"></div>
                    </div>
                    <div class="skeleton-brand"></div>
                    <div class="skeleton-title"></div>
                    <div class="skeleton-price"></div>
                </div>
            </div>

            <div class="section-grid" *ngIf="!loading && displayedProducts.length > 0">
                <div class="product-card" *ngFor="let product of displayedProducts" (click)="goToProduct(product.id)">
                    <div class="product-image">
                        <img [src]="product.imageUrl[0] || 'https://via.placeholder.com/200'" [alt]="product.title">
                    </div>
                    <div class="product-brand">{{ product.brand || 'Бренд не указан' }}</div>
                    <div class="product-title">{{ product.title }}</div>
                    <div class="product-price">{{ product.price }} BYN</div>
                </div>
            </div>

            <div class="no-data" *ngIf="!loading && displayedProducts.length === 0">
                <p>Новинок пока нет</p>
            </div>
        </div>

        <div class="carousel-arrow right-arrow" (click)="nextSlide()">
            <div class="arrow">›</div>
        </div>
    </div>
</div>
