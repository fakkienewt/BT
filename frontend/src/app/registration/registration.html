<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <button class="auth-tab" [class.active]="activeTab === 'login'" (click)="switchTab('login')">
                Вход
            </button>
            <button class="auth-tab" [class.active]="activeTab === 'register'" (click)="switchTab('register')">
                Регистрация
            </button>
        </div>

        <div class="auth-form" *ngIf="activeTab === 'login'">
            <div class="form-group">
                <label>Email</label>
                <input type="email" [(ngModel)]="loginData.email" placeholder="example@mail.com">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" [(ngModel)]="loginData.password" placeholder="••••••••">
            </div>
            <button class="auth-btn" (click)="onLogin()">Войти</button>
        </div>

        <div class="auth-form" *ngIf="activeTab === 'register'">
            <div class="form-group">
                <label>Имя пользователя *</label>
                <input type="text" [(ngModel)]="registerData.username" placeholder="username">
            </div>
            <div class="form-group">
                <label>Email *</label>
                <input type="email" [(ngModel)]="registerData.email" placeholder="example@mail.com">
            </div>
            <div class="form-group">
                <label>Пароль *</label>
                <input type="password" [(ngModel)]="registerData.password" placeholder="••••••••">
            </div>
            <div class="form-group">
                <label>Подтверждение пароля *</label>
                <input type="password" [(ngModel)]="registerData.confirmPassword" placeholder="••••••••">
            </div>
            <button class="auth-btn" (click)="onRegister()">Зарегистрироваться</button>
        </div>
    </div>
</div>
